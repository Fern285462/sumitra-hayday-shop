<html lang="th">
<head>

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:#fff8ed;
  color:#4b3621;
}
header{
  background:linear-gradient(135deg,#f6b73c,#f28c28);
  color:white;
  text-align:center;
  padding:35px 15px;
}
header h1{margin:0;font-size:32px}
header p{margin:10px 0 0;font-size:17px}

  margin:auto;
  padding:25px 15px;
}
.title{
  text-align:center;
  margin-bottom:25px;
}
.products{

  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  text-align:center;

.icon{

  margin-bottom:10px;
}
.card h3{
  margin:8px 0;
  font-size:21px;
}
.price{

  font-size:24px;
  font-weight:bold;
  margin:12px 0;
}
.btn{
  display:inline-block;
  background:#25a55f;
  color:white;
  text-decoration:none;
  padding:11px 22px;
  border-radius:25px;
  font-weight:bold;
}
.btn:hover{background:#18834a}

.info{

  box-shadow:0 5px 18px rgba(0,0,0,.06);
}
